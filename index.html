<style>
/* フリーケア公式カラー：グリーン #8EC31F（ロゴ実測）＋グレー #7F8080系 */
:root{--brand:#8EC31F;--brand-ink:#1f2f10;--brand-dark:#4f7a0e;--logo-gray:#5f6062;--bg:#f6f7f4;--line:#dfe3ea;--text:#1f2937;--muted:#6b7280;--today:#f3f9e4;--hover:#f1f8e3}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-text-size-adjust:100%}
header{background:#fff;color:var(--text);padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:4px solid var(--brand)}
.ttl{display:flex;align-items:center;gap:10px;min-width:0}
.ttl img{height:40px;width:auto;flex:none}
h1{font-size:17px;margin:0;font-weight:700;color:var(--logo-gray);letter-spacing:.02em}
.sub{font-size:12px;color:var(--muted)}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 16px 6px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer;color:var(--text);line-height:1.2}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.btn.danger{background:#fff;color:#c62828;border-color:#f3b3b3}
.btn.warn{background:#fff;color:#b45309;border-color:#f6d5a8}
.btn:disabled{opacity:.5;cursor:default}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg2 button{border:0;background:#fff;padding:8px 12px;font-size:14px;cursor:pointer;color:var(--text)}
.seg2 button+button{border-left:1px solid var(--line)}
.seg2 button.on{background:var(--brand);color:var(--brand-ink);font-weight:700}
.range{font-weight:700;font-size:15px;margin:0 6px}
.legend{display:flex;gap:6px 10px;flex-wrap:wrap;padding:0 16px 8px}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.lg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.days{display:none;gap:4px;padding:0 16px 8px}
.days.show{display:flex}
.day{flex:1;text-align:center;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 0;font-size:12px;cursor:pointer;line-height:1.3}
.day.sel{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.day.sat{color:#1565c0}.day.sun{color:#c62828}.day.sel.sat,.day.sel.sun{color:var(--brand-ink)}
.day.today:not(.sel){background:var(--today)}
.wrap{padding:0 16px 24px}
/* 週・日のグリッド */
.grid{display:grid;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.grid.single{max-width:760px}
.hd{background:#f8fafc;border-bottom:1px solid var(--line);border-left:1px solid var(--line);text-align:center;font-size:12px;padding:6px 2px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hd.sat{color:#1565c0}.hd.sun{color:#c62828}.hd.today{background:var(--today)}
.hd.room{font-weight:500;color:var(--muted);font-size:11px;padding:4px 2px}
.hd.corner{border-left:0}
.tm{font-size:11px;color:var(--muted);text-align:right;padding:3px 6px 0 0;border-top:1px solid var(--line)}
.cell{border-top:1px solid var(--line);border-left:1px solid var(--line);cursor:pointer;min-width:0}
.cell:hover{background:var(--hover)}
.cell.past{background:#eff1f4;cursor:default}
.cell.past:hover{background:#eff1f4}
.cell.today{background:var(--today)}
.cell.today:hover{background:#e6f2cd}
.cell.sep,.hd.sep{border-left:2px solid #c3cad6}
.chip{margin:2px;border-radius:6px;padding:3px 5px;font-size:11px;line-height:1.3;overflow:hidden;cursor:pointer;z-index:2;border-left:4px solid;display:flex;flex-direction:column;min-width:0;background:#fff}
.chip:hover{filter:brightness(.96)}
.chip b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
.chip small{display:block;opacity:.7;font-size:10px}
/* 月グリッド */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mhd{text-align:center;font-size:12px;padding:6px 0;background:#f8fafc;border-bottom:1px solid var(--line);font-weight:700;color:var(--muted)}
.mhd.sun{color:#c62828}.mhd.sat{color:#1565c0}
.mday{border-top:1px solid var(--line);border-left:1px solid var(--line);min-height:108px;padding:3px;cursor:pointer;min-width:0}
.mgrid>:nth-child(7n+1){border-left:0}
.mday:hover{background:var(--hover)}
.mday.out{background:#fafbfc}
.mday.today{background:var(--today)}
.mnum{font-size:12px;width:22px;height:22px;line-height:22px;text-align:center;margin:0 auto 2px;font-weight:700;border-radius:50%}
.mday.sun .mnum{color:#c62828}.mday.sat .mnum{color:#1565c0}
.mday.out .mnum{color:#b0b7c3}
.mday.today .mnum{background:var(--brand);color:var(--brand-ink)}
.mchip{font-size:11px;line-height:1.35;color:#fff;border-radius:4px;padding:1px 4px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.mchip:hover{filter:brightness(1.1)}
.mchip b{font-weight:700;opacity:.95;margin-right:1px;font-feature-settings:"palt";letter-spacing:-.5px}
.mchip.temae{border-left:3px solid rgba(255,255,255,.7)}
.help{padding:0 16px 24px;font-size:12px;color:var(--muted);line-height:1.6}
/* 旧アドレス（Apps Script版）で開いた時だけ出す案内 */
.moved{background:#fff7d6;border-bottom:1px solid #f1e2a8;color:#5b4a00;padding:8px 16px;font-size:13px;line-height:1.6}
.moved a{color:#1d4ed8;font-weight:700;word-break:break-all}
.moved[hidden]{display:none}
/* モーダル */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.ov[hidden]{display:none}
.modal{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;box-shadow:0 10px 40px rgba(0,0,0,.25)}
@media(min-width:600px){.ov{align-items:center;padding:16px}.modal{border-radius:14px}}
.mh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px;position:sticky;top:0;background:#fff}
.x{border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.mb{padding:12px 16px}
.mb label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px;font-weight:700}
.mb label:first-child{margin-top:0}
.mb label small{font-weight:400}
.mb input[type=text],.mb input[type=date],.mb select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:#fff;color:var(--text)}
.row{display:flex;align-items:center;gap:8px}
.row select{flex:1}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:14px;cursor:pointer;color:var(--text)}
.seg button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:7px 10px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:13px;cursor:pointer;color:var(--text);border-left:4px solid}
.chips button.on{color:#fff}
.chips button.nm{border-left:1px solid var(--line)}
.chips button.nm.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
.err{margin-top:12px;background:#fdecea;color:#b71c1c;border:1px solid #f5c6c2;border-radius:8px;padding:10px;font-size:13px;line-height:1.5}
.mf{display:flex;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.mf .sp{flex:1}
.dl{font-size:14px;line-height:1.7}
.dl b{display:inline-block;min-width:5em;color:var(--muted);font-weight:700;font-size:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;color:#fff;margin-right:4px}
.note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
/* ローディング */
.ld{position:fixed;inset:0;background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;z-index:100;font-size:14px;color:var(--brand-dark);font-weight:700}
.ld[hidden]{display:none}
.spin{width:22px;height:22px;border:3px solid #dfeec4;border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
/* スマホ */
@media(max-width:759px){
  header{padding:10px 16px}
  .nav{padding:8px 16px 6px;gap:4px}
  .nav .range{font-size:14px;margin:0 2px}
  .nav .btn{padding:8px 10px}
  #vwWeek{display:none}
  .legend{display:none}
  .chip{font-size:12px}
  .mday{min-height:92px;padding:2px 1px}
  .mchip{font-size:10px;padding:1px 2px;border-radius:3px;margin:1px 0;text-overflow:clip;letter-spacing:-.2px}
  .mchip b{margin-right:0}
  .mchip.temae{border-left-width:2px}
  .mnum{font-size:11px;width:20px;height:20px;line-height:20px}
}
@media(min-width:760px){
  .days.show{max-width:792px}
}
</style>

function p2(n){return (n<10?'0':'')+n}
function dnum(s){var p=s.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2])/864e5}
function dstr(n){var d=new Date(n*864e5);return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate())}
function wday(s){return new Date(dnum(s)*864e5).getUTCDay()}
function nth(s){return Math.ceil(+s.split('-')[2]/7)}
function weekStartOf(s){return dstr(dnum(s)-wday(s))}          // 日曜始まり
function addD(s,k){return dstr(dnum(s)+k)}
function monthOf(s){return s.slice(0,7)+'-01'}
function addMonths(m,k){var y=+m.slice(0,4),mo=+m.slice(5,7)-1+k;var d=new Date(Date.UTC(y,mo,1));return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-01'}
function daysInMonth(m){var y=+m.slice(0,4),mo=+m.slice(5,7);return new Date(Date.UTC(y,mo,0)).getUTCDate()}
function md(s){var p=s.split('-');return (+p[1])+'/'+(+p[2])}
function ymd(s){var p=s.split('-');return p[0]+'年'+(+p[1])+'月'+(+p[2])+'日（'+WD[wday(s)]+'）'}
function ym(s){var p=s.split('-');return p[0]+'年'+(+p[1])+'月'}
function ft(h){var m=Math.round(h*60);return Math.floor(m/60)+':'+p2(m%60)}
function recurLabel(recur,s){
  if(!s)return '';
  var w=WD[wday(s)];
  if(recur==='weekly')return '毎週 '+w+'曜日';
  if(recur==='weekly_skip4')return '毎週 '+w+'曜日（5回ある月は第4週を除く）';
  if(recur==='monthly_nth'){var n=nth(s);return '毎月 第'+n+w+'曜日'+(n===5?'（第5がある月のみ）':'')}
  if(recur==='monthly_day')return '毎月 '+(+s.split('-')[2])+'日';
  return 'なし';
}
function tint(hex,a){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return 'rgba('+r+','+g+','+b+','+a+')'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

// ───────── 状態 ─────────
// view: 'month'（月一覧）/ 'week'（7日×2室・PCのみ）/ 'day'（1日×2室）
// anchor: いま注目している日付。month は表示中の月（1日）
var S = { view:'month', anchor:null, month:null, weekStart:null, data:null, mdata:null, cur:[], today:null, editing:null, meta:null, lastLoad:0 };
function isMobile(){return window.matchMedia('(max-width:759px)').matches}
function colorOf(p){var ps=(S.meta&&S.meta.purposes)||[];for(var i=0;i<ps.length;i++)if(ps[i].name===p)return ps[i].color;return '#6b7280'}
function roomMark(r){return r.indexOf('手前')>=0?'【前】':'【奥】'}
function isTemae(r){return r.indexOf('手前')>=0}

// ───────── サーバー呼び出し ─────────
// Google Apps Script 内で表示されている時は google.script.run、GitHub Pages 等の外部URLで表示されている時は
// 同じ Apps Script を JSON API（doPost）として fetch で呼ぶ（同じ画面ファイルを両方で使う）
var API_URL='https://script.google.com/macros/s/AKfycby-KfekUce8Jgj7rzBaaVcoTyqF8-onL1fv2qhFDD_KZ879PCbtrVgDTFy1EIZiR-Q/exec';
var USE_GAS=(typeof google!=='undefined'&&google.script&&google.script.run)?true:false;
// quiet=true は自動更新用（読み込み中の表示を出さず、失敗しても黙って次回に回す）
function call(fn,args,cb,quiet){
  if(!quiet)showLd(true);
  if(USE_GAS){
    google.script.run
      .withSuccessHandler(function(r){showLd(false);cb(r)})
      .withFailureHandler(function(e){showLd(false);if(!quiet)alert('エラーが発生しました：\n'+(e&&e.message?e.message:e))})
      [fn](args[0],args[1],args[2]);
    return;
  }
  apiCall(fn,args.filter(function(a){return a!==undefined}))
    .then(function(result){showLd(false);cb(result)})
    .catch(function(e){showLd(false);if(quiet)return;alert((e&&e.transport?'通信エラーです：':'エラーが発生しました：\n')+e.message+(e&&e.transport?'\n電波状況を確認して、ページを開き直してください':''))});
}
// 外部URL（GitHub Pages）からの呼び出し経路は2本：
//  ①橋渡し iframe（Apps Script の画面を見えない形で読み込み、postMessage → google.script.run で実行。標準経路で安定・速い）
//  ②JSON API（doPost を fetch。①が使えない時の予備。中継サーバーの不調で一時的に404/遅延になることがあるため再試行付き）
var BRIDGE={win:null,origin:null,ready:false,pending:{},seq:0,used:0};
function initBridge(){
  if(USE_GAS)return;
  window.addEventListener('message',function(ev){
    var d=ev.data; if(!d||typeof d.type!=='string')return;
    if(d.type==='fc-bridge-ready'){
      if(!/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(ev.origin))return;
      BRIDGE.win=ev.source;BRIDGE.origin=ev.origin;BRIDGE.ready=true;return;
    }
    if(d.type==='fc-api-res'){
      var p=BRIDGE.pending[d.id]; if(!p)return;
      delete BRIDGE.pending[d.id]; clearTimeout(p.timer);
      if(d.ok)p.res(d.result); else p.rej(new Error(d.error||'error'));
    }
  });
  var f=document.createElement('iframe');
  f.src=API_URL+'?bridge=1';
  f.style.cssText='position:absolute;width:0;height:0;border:0;visibility:hidden';
  f.setAttribute('aria-hidden','true'); f.tabIndex=-1;
  document.body.appendChild(f);
}
function waitBridge(ms){
  return new Promise(function(res){
    if(BRIDGE.ready)return res(true);
    var t0=Date.now();
    (function poll(){ if(BRIDGE.ready)return res(true); if(Date.now()-t0>ms)return res(false); setTimeout(poll,100); })();
  });
}
function bridgeCall(fn,args){
  return new Promise(function(res,rej){
    var id=++BRIDGE.seq;
    BRIDGE.pending[id]={res:res,rej:rej,timer:setTimeout(function(){delete BRIDGE.pending[id];var e=new Error('bridge timeout');e.transport=true;rej(e)},25000)};
    try{BRIDGE.win.postMessage({type:'fc-api',id:id,fn:fn,args:args},BRIDGE.origin);BRIDGE.used++;}
    catch(err){delete BRIDGE.pending[id];var e2=new Error('bridge error');e2.transport=true;rej(e2);}
  });
}
function fetchUnwrap(body){
  return apiFetch(body).then(function(r){ if(!r.ok)throw new Error(r.error||'error'); return r.result; },
    function(e){ var t=new Error(e&&e.message?e.message:'network'); t.transport=true; throw t; });
}
function apiCall(fn,args){
  var body=JSON.stringify({fn:fn,args:args});
  return waitBridge(3000).then(function(ready){
    if(!ready)return fetchUnwrap(body);
    return bridgeCall(fn,args).catch(function(e){ if(e&&e.transport)return fetchUnwrap(body); throw e; });
  });
}
initBridge();
// Apps Script は公開直後などに一時的に 404 や遅延を返すことがあるため、20秒で打ち切り＋最大3回まで自動で再試行する
function apiFetch(body,attempt){
  attempt=attempt||1;
  var ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
  var timer=ctrl?setTimeout(function(){ctrl.abort()},20000):null;
  var opts={method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body};
  if(ctrl)opts.signal=ctrl.signal;
  return fetch(API_URL,opts).then(function(r){
    if(timer)clearTimeout(timer);
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).catch(function(e){
    if(timer)clearTimeout(timer);
    if(attempt<3)return new Promise(function(res){setTimeout(res,700*attempt)}).then(function(){return apiFetch(body,attempt+1)});
    throw e;
  });
}
function showLd(on){document.getElementById('ld').hidden=!on}
var toastT;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},2200)}
function takeMeta(r){S.meta={rooms:r.rooms,purposes:r.purposes,names:r.names||[],hourStart:r.hourStart,hourEnd:r.hourEnd};S.today=r.today}

/** 月の予約を読み込む（グリッドは前後月のはみ出し分も含む） */
function loadMonth(m,cb,quiet){
  var g=monthGrid(m);
  call('getRange',[g.days[0],g.days[g.days.length-1]],function(r){
    takeMeta(r); S.mdata=r; S.month=m; S.view='month'; S.lastLoad=Date.now();
    render(); if(cb)cb();
  },quiet);
}
/** 週の予約を読み込む（週・日表示） */
function loadWeek(ws,cb,quiet){
  call('getWeek',[ws],function(r){
    takeMeta(r); S.data=r; S.weekStart=r.from; S.lastLoad=Date.now();
    if(!S.anchor||S.anchor<r.from||S.anchor>r.to)S.anchor=r.from;
    render(); if(cb)cb();
  },quiet);
}
function refresh(quiet){ if(S.view==='month')loadMonth(S.month,null,quiet); else loadWeek(S.weekStart,null,quiet); }

// ───────── 自動更新（更新ボタンの代わり） ─────────
// 画面に戻ってきた時（30秒以上経過）と、表示中は2分ごとに、他の人の予約を静かに取り込む。フォームを開いている間は触らない
function modalOpen(){return !document.getElementById('ov').hidden||!document.getElementById('dv').hidden}
function autoRefresh(minAge){
  if(!S.meta||modalOpen()||document.visibilityState!=='visible')return;
  if(Date.now()-(S.lastLoad||0)<minAge)return;
  refresh(true);
}
document.addEventListener('visibilitychange',function(){autoRefresh(30000)});
window.addEventListener('pageshow',function(){autoRefresh(30000)});
window.addEventListener('focus',function(){autoRefresh(30000)});
setInterval(function(){autoRefresh(120000)},30000);

// ───────── ナビ ─────────
function setView(v){
  if(v==='week'&&isMobile())v='day';
  var a=S.anchor||S.today;
  if(v==='month'){S.view='month';loadMonth(monthOf(a));return;}
  S.view=v;
  var ws=weekStartOf(a);
  if(S.data&&S.weekStart===ws){render();}else{loadWeek(ws);}
}
function navMove(k){
  if(S.view==='month'){var m=addMonths(S.month,k);S.anchor=(monthOf(S.today)===m)?S.today:m;loadMonth(m);return;}
  if(S.view==='week'){S.anchor=addD(S.anchor,7*k);loadWeek(addD(S.weekStart,7*k));return;}
  var d=addD(S.anchor,k); S.anchor=d;
  var ws=weekStartOf(d);
  if(ws===S.weekStart)render();else loadWeek(ws);
}
function goToday(){
  S.anchor=S.today;
  if(S.view==='month'){loadMonth(monthOf(S.today));return;}
  var ws=weekStartOf(S.today);
  if(S.data&&S.weekStart===ws)render();else loadWeek(ws);
}
/** 月画面で日付を押した → その日の予約画面へ */
function gotoDay(d){
  S.anchor=d; S.view='day';
  var ws=weekStartOf(d);
  if(S.data&&S.weekStart===ws)render();else loadWeek(ws);
}
function selDay(d){S.anchor=d;render()}
window.addEventListener('resize',function(){if(S.view==='week'&&isMobile())S.view='day';render()});

// ───────── 描画 ─────────
function render(){
  if(!S.meta)return;
  document.querySelectorAll('#viewSeg button').forEach(function(b){b.classList.remove('on')});
  var vb=document.getElementById(S.view==='month'?'vwMonth':S.view==='week'?'vwWeek':'vwDay'); if(vb)vb.classList.add('on');
  document.getElementById('legend').innerHTML=S.meta.purposes.map(function(p){return '<span class="lg"><i style="background:'+p.color+'"></i>'+esc(p.name)+'</span>'}).join('');
  var help=document.getElementById('help');
  if(S.view==='month'){
    document.getElementById('days').className='days';
    help.innerHTML='日付を押すとその日の予約画面が開きます。色のついた予定を押すと内容の確認・変更・取消ができます（誰でも操作できます）。<br>【奥】【前】は会議室【奥】【手前】の印です。';
    renderMonth();
  }else{
    help.innerHTML='空いている枠を押すと予約できます。予約を押すと内容の確認・変更・取消ができます（誰でも操作できます）。<br>くり返し予約（毎週／毎週・5回ある月は第4週除く／毎月 第N曜日／毎月 X日）にも対応しています。';
    renderGrid();
  }
}

function monthGrid(m){
  var fw=wday(m), start=addD(m,-fw), dim=daysInMonth(m);
  var rows=Math.ceil((fw+dim)/7), days=[];
  for(var i=0;i<rows*7;i++)days.push(addD(start,i));
  return {days:days,rows:rows};
}

function renderMonth(){
  var d=S.mdata, m=S.month, g=monthGrid(m);
  document.getElementById('range').textContent=ym(m);
  S.cur=d.items;
  var byDate={};
  d.items.forEach(function(it,idx){(byDate[it.date]=byDate[it.date]||[]).push(idx)});
  var h='<div class="mgrid">';
  WD.forEach(function(w,i){h+='<div class="mhd'+(i===0?' sun':i===6?' sat':'')+'">'+w+'</div>'});
  g.days.forEach(function(s){
    var w=wday(s), out=s.slice(0,7)!==m.slice(0,7);
    var cls='mday'+(out?' out':'')+(s===S.today?' today':'')+(w===0?' sun':w===6?' sat':'');
    h+='<div class="'+cls+'" onclick="gotoDay(\''+s+'\')"><div class="mnum">'+(+s.slice(8))+'</div>';
    (byDate[s]||[]).forEach(function(idx){
      var it=d.items[idx], c=colorOf(it.purpose);
      var label=it.purpose==='その他'&&it.detail?it.detail:it.purpose;
      h+='<div class="mchip'+(isTemae(it.room)?' temae':'')+'" style="background:'+c+'" title="'+esc(it.room+' '+ft(it.start)+'〜'+ft(it.end)+' '+label+'（'+it.name+'）')+'" onclick="event.stopPropagation();openDetail('+idx+')"><b>'+roomMark(it.room)+'</b>'+esc(label)+'</div>';
    });
    h+='</div>';
  });
  h+='</div>';
  document.getElementById('wrap').innerHTML=h;
}

function renderGrid(){
  var d=S.data; if(!d)return;
  var days=[]; for(var i=0;i<7;i++)days.push(addD(d.from,i));
  var single=(S.view==='day')||isMobile();
  if(S.anchor<d.from||S.anchor>d.to)S.anchor=d.from;
  var sel=dnum(S.anchor)-dnum(d.from);
  document.getElementById('range').textContent=single?ymd(S.anchor):(ymd(days[0]).replace(/（.*）/,'')+' 〜 '+md(days[6]));

  // 日付タブ（1日表示のとき）
  var dd=document.getElementById('days');
  dd.className='days'+(single?' show':'');
  if(single){
    dd.innerHTML=days.map(function(s,i){
      var w=wday(s);
      return '<div class="day'+(i===sel?' sel':'')+(w===6?' sat':w===0?' sun':'')+(s===S.today?' today':'')+'" onclick="selDay(\''+s+'\')">'+WD[w]+'<br><b>'+md(s)+'</b></div>';
    }).join('');
  }
  var show=single?[days[sel]]:days;
  S.cur=d.items;

  var hs=S.meta.hourStart,he=S.meta.hourEnd,nH=he-hs;
  var rooms=S.meta.rooms;
  var nCol=show.length*rooms.length;
  var mob=isMobile();
  // 行は30分刻み（1時間＝2行）。時刻ラベルと空きセルは2行ぶち抜き、予約チップは30分単位で置ける
  var h='<div class="grid'+(single?' single':'')+'" style="grid-template-columns:'+(mob?'44px':'52px')+' repeat('+nCol+',minmax(0,1fr));grid-template-rows:auto auto repeat('+(nH*2)+','+(mob?'32px':'28px')+')">';
  h+='<div class="hd corner" style="grid-row:1/3;grid-column:1"></div>';
  show.forEach(function(s,i){
    var w=wday(s);
    var cls='hd'+(w===6?' sat':w===0?' sun':'')+(s===S.today?' today':'')+(i>0?' sep':'');
    h+='<div class="'+cls+'" style="grid-row:1;grid-column:'+(2+i*rooms.length)+'/'+(2+(i+1)*rooms.length)+'">'+(single?ymd(s):WD[w]+' '+md(s))+'</div>';
    rooms.forEach(function(r,ri){
      var c2='hd room'+(s===S.today?' today':'')+(ri===0&&i>0?' sep':'');
      h+='<div class="'+c2+'" style="grid-row:2;grid-column:'+(2+i*rooms.length+ri)+'">'+esc(r.replace('会議室',''))+'</div>';
    });
  });
  for(var hh=hs;hh<he;hh++){
    var row=3+(hh-hs)*2;
    h+='<div class="tm" style="grid-row:'+row+'/'+(row+2)+';grid-column:1">'+hh+':00</div>';
    show.forEach(function(s,i){
      var past=s<S.today;
      rooms.forEach(function(r,ri){
        var col=2+i*rooms.length+ri;
        var cls='cell'+(past?' past':'')+(s===S.today?' today':'')+(ri===0&&i>0?' sep':'');
        h+='<div class="'+cls+'" style="grid-row:'+row+'/'+(row+2)+';grid-column:'+col+'"'+(past?'':' onclick="openNew(\''+s+'\','+ri+','+hh+')"')+'></div>';
      });
    });
  }
  d.items.forEach(function(it,idx){
    var di=show.indexOf(it.date); if(di<0)return;
    var ri=rooms.indexOf(it.room); if(ri<0)return;
    var col=2+di*rooms.length+ri;
    var r1=3+Math.round((it.start-hs)*2), r2=3+Math.round((it.end-hs)*2);
    var c=colorOf(it.purpose);
    var label=it.purpose==='その他'&&it.detail?it.detail:it.purpose;
    var bg=tint(c,.18);
    h+='<div class="chip" style="grid-row:'+r1+'/'+r2+';grid-column:'+col+';background:linear-gradient('+bg+','+bg+'),#fff;border-left-color:'+c+'" onclick="openDetail('+idx+')" title="'+esc(label+' / '+it.name+' '+ft(it.start)+'〜'+ft(it.end))+'">'
      +'<b>'+esc(label)+'</b><span>'+esc(it.name)+'</span>'
      +(it.end-it.start>=1.5?'<small>'+ft(it.start)+'〜'+ft(it.end)+(it.recur!=='none'?' ↻':'')+'</small>':(it.recur!=='none'?'<small>↻ くり返し</small>':''))
      +'</div>';
  });
  h+='</div>';
  document.getElementById('wrap').innerHTML=h;
}

// ───────── 予約フォーム ─────────
var F={room:'',purpose:''};
function buildFormStatics(){
  var d=S.meta;
  var fr=document.getElementById('fRoom');
  fr.innerHTML=d.rooms.map(function(r){return '<button type="button" onclick="pickRoom(\''+esc(r)+'\')">'+esc(r)+'</button>'}).join('');
  var st=document.getElementById('fStart'),en=document.getElementById('fEnd');
  st.innerHTML='';en.innerHTML='';
  for(var hh=d.hourStart;hh<d.hourEnd;hh+=0.5){st.innerHTML+='<option value="'+hh+'">'+ft(hh)+'</option>'}
  for(var h2=d.hourStart+0.5;h2<=d.hourEnd;h2+=0.5){en.innerHTML+='<option value="'+h2+'">'+ft(h2)+'</option>'}
  var fp=document.getElementById('fPurpose');
  fp.innerHTML=d.purposes.map(function(p){return '<button type="button" data-c="'+p.color+'" style="border-left-color:'+p.color+'" onclick="pickPurpose(\''+esc(p.name)+'\')">'+esc(p.name)+'</button>'}).join('');
  var fn=document.getElementById('fNames');
  fn.innerHTML=(d.names||[]).map(function(n){return '<button type="button" class="nm" onclick="pickName(\''+esc(n)+'\')">'+esc(n)+'</button>'}).join('');
}
function pickName(n){document.getElementById('fName').value=n;syncNameChips()}
function syncNameChips(){
  var v=document.getElementById('fName').value.trim();
  document.querySelectorAll('#fNames button').forEach(function(b){b.classList.toggle('on',b.textContent===v)});
}
function pickRoom(r){F.room=r;var bs=document.querySelectorAll('#fRoom button');bs.forEach(function(b){b.classList.toggle('on',b.textContent===r)})}
function pickPurpose(p){
  F.purpose=p;
  document.querySelectorAll('#fPurpose button').forEach(function(b){
    var on=b.textContent===p; b.classList.toggle('on',on);
    b.style.background=on?b.getAttribute('data-c'):'#fff';
  });
  document.getElementById('fDetail').placeholder=p==='その他'?'内容を入力してください（必須）':'例：〇〇の打合せ';
}
function fixEnd(){var s=+document.getElementById('fStart').value,e=document.getElementById('fEnd');if(+e.value<=s)e.value=String(s+1)}
function onDateChange(){onRecurChange(true)}
function onRecurChange(keep){
  var sel=document.getElementById('fRecur');
  var cur=sel.value||'none';
  var ds=document.getElementById('fDate').value||S.today;
  var opts=[['none','なし'],['weekly',recurLabel('weekly',ds)],['weekly_skip4',recurLabel('weekly_skip4',ds)],['monthly_nth',recurLabel('monthly_nth',ds)],['monthly_day',recurLabel('monthly_day',ds)]];
  sel.innerHTML=opts.map(function(o){return '<option value="'+o[0]+'">'+esc(o[1])+'</option>'}).join('');
  sel.value=cur;
  document.getElementById('recurEndRow').hidden=(sel.value==='none');
}
function setErr(msg){var e=document.getElementById('fErr');e.hidden=!msg;e.innerHTML=msg||''}

function openNew(date,ri,hour){
  if(date<S.today)return;
  S.editing=null;
  buildFormStatics();
  document.getElementById('mtitle').textContent='予約する';
  document.getElementById('fSubmit').textContent='予約する';
  pickRoom(S.meta.rooms[ri]);
  document.getElementById('fDate').value=date;
  document.getElementById('fStart').value=String(hour);
  document.getElementById('fEnd').value=String(hour+1);
  pickPurpose('');
  document.getElementById('fDetail').value='';
  document.getElementById('fName').value='';
  syncNameChips();
  document.getElementById('fRecur').value='none';
  onRecurChange();
  document.getElementById('fRecur').value='none';
  document.getElementById('recurEndRow').hidden=true;
  document.getElementById('fRecurEnd').value='';
  setErr('');
  document.getElementById('ov').hidden=false;
}
function openEdit(it){
  S.editing=it;
  buildFormStatics();
  document.getElementById('mtitle').textContent=it.recur!=='none'?'くり返し予約を変更（全体）':'予約を変更';
  document.getElementById('fSubmit').textContent='保存する';
  pickRoom(it.room);
  document.getElementById('fDate').value=it.recur!=='none'?it.ruleDate:it.date;
  document.getElementById('fStart').value=String(it.start);
  document.getElementById('fEnd').value=String(it.end);
  pickPurpose(it.purpose);
  document.getElementById('fDetail').value=it.detail||'';
  document.getElementById('fName').value=it.name||'';
  syncNameChips();
  onRecurChange();
  document.getElementById('fRecur').value=it.recur||'none';
  document.getElementById('recurEndRow').hidden=(it.recur==='none');
  document.getElementById('fRecurEnd').value=it.recurEnd||'';
  setErr(it.recur!=='none'?'<b>くり返し予約の全体</b>を変更します。日付は「くり返しの起点日」です。':'');
  document.getElementById('ov').hidden=false;
}
function closeModal(){document.getElementById('ov').hidden=true}

function submitForm(){
  var p={
    room:F.room, date:document.getElementById('fDate').value,
    start:+document.getElementById('fStart').value, end:+document.getElementById('fEnd').value,
    purpose:F.purpose, detail:document.getElementById('fDetail').value.trim(),
    name:document.getElementById('fName').value.trim(),
    recur:document.getElementById('fRecur').value||'none',
    recurEnd:document.getElementById('fRecurEnd').value||''
  };
  if(!p.room)return setErr('会議室を選んでください');
  if(!p.date)return setErr('日付を選んでください');
  if(p.end<=p.start)return setErr('終了は開始より後にしてください');
  if(!p.purpose)return setErr('目的を選んでください');
  if(p.purpose==='その他'&&!p.detail)return setErr('「その他」の場合は内容を入力してください');
  if(!p.name)return setErr('予約者（お名前）を入力してください');
  if(p.recur!=='none'&&p.recurEnd&&p.recurEnd<p.date)return setErr('くり返しの終了日は開始日以降にしてください');
  setErr('');
  var fn='createBooking';
  if(S.editing){p.id=S.editing.id;fn='updateBooking'}
  call(fn,[p],function(r){
    if(!r.ok&&r.conflict){
      var c=r.conflict;
      setErr('この時間は空いていません：<br><b>'+esc(ymd(c.date))+' '+ft(c.start)+'〜'+ft(c.end)+'</b> に「'+esc(c.purpose)+'（'+esc(c.name)+'）」が入っています。'+(p.recur!=='none'?'<br>くり返しのいずれかの回が重なっています。時間・部屋・終了日を見直してください。':''));
      return;
    }
    closeModal();
    toast(S.editing?'変更しました':'予約しました');
    // 予約した日を表示
    if(S.view==='month'){S.anchor=p.date;loadMonth(monthOf(p.date));}
    else{S.anchor=p.date;loadWeek(weekStartOf(p.date));}
  });
}

// ───────── 詳細・取消 ─────────
function openDetail(idx){
  var it=S.cur[idx]; if(!it)return;
  var c=colorOf(it.purpose);
  var b='<div><b>会議室</b>'+esc(it.room)+'</div>'
    +'<div><b>日時</b>'+esc(ymd(it.date))+' '+ft(it.start)+'〜'+ft(it.end)+'</div>'
    +'<div><b>目的</b><span class="tag" style="background:'+c+'">'+esc(it.purpose)+'</span>'+(it.detail?esc(it.detail):'')+'</div>'
    +'<div><b>予約者</b>'+esc(it.name)+'</div>'
    +'<div><b>くり返し</b>'+esc(it.recur!=='none'?(it.recurLabel+(it.recurEnd?'（'+it.recurEnd+' まで）':'')):'なし')+'</div>';
  document.getElementById('dBody').innerHTML=b;
  document.getElementById('dNote').textContent=it.recur!=='none'?'くり返し予約です。「この回だけ取消」はこの日の分だけ、「この回以降を取消」はこの日から先のすべてを取り消します。':'';
  var bt='<button class="btn" onclick="closeDetail()">閉じる</button><span class="sp"></span>';
  bt+='<button class="btn" onclick="closeDetail();openEdit(S.cur['+idx+'])">変更</button>';
  if(it.recur!=='none'){
    bt+='<button class="btn warn" onclick="cancelIt('+idx+',\'single\')">この回だけ取消</button>';
    bt+='<button class="btn danger" onclick="cancelIt('+idx+',\'series\')">この回以降を取消</button>';
  }else{
    bt+='<button class="btn danger" onclick="cancelIt('+idx+',\'single\')">取消</button>';
  }
  document.getElementById('dBtns').innerHTML=bt;
  document.getElementById('dv').hidden=false;
}
function closeDetail(){document.getElementById('dv').hidden=true}
function cancelIt(idx,mode){
  var it=S.cur[idx]; if(!it)return;
  var msg=mode==='series'&&it.recur!=='none'
    ?ymd(it.date)+' 以降の「'+it.purpose+'（'+it.name+'）」のくり返しをすべて取り消します。よろしいですか？'
    :ymd(it.date)+' '+ft(it.start)+'〜'+ft(it.end)+' の「'+it.purpose+'（'+it.name+'）」を取り消します。よろしいですか？';
  if(!confirm(msg))return;
  call('cancelBooking',[it.id,mode,it.date],function(r){
    closeDetail();
    toast(r&&r.already?'すでに取り消されていました':'取り消しました');
    refresh();
  });
}

// ───────── 初期化（月表示から開始） ─────────
(function init(){
  if(USE_GAS)document.getElementById('moved').hidden=false;   // 旧アドレスでは新アドレスへの案内を出す
  var t=dstr(Math.floor(Date.now()/864e5)); // まずは端末の日付で月を決め、サーバーの today で補正
  S.anchor=t;
  loadMonth(monthOf(t),function(){
    if(S.today&&monthOf(S.today)!==S.month){S.anchor=S.today;loadMonth(monthOf(S.today));}
  });
})();
</script>
